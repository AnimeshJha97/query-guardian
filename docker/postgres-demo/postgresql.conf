# Query Guardian demo config — deliberately verbose/aggressive settings
# so the demo produces visible signal fast. Do NOT copy these thresholds
# straight into production; auto_explain.log_min_duration = 0 logs every
# query and will fill disks on a real workload.

listen_addresses = '*'

shared_preload_libraries = 'pg_stat_statements,auto_explain'

# pg_stat_statements
pg_stat_statements.track = all
pg_stat_statements.max = 5000

# auto_explain — JSON output, ANALYZE included, low threshold for the demo
auto_explain.log_min_duration = '0ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_format = 'json'
auto_explain.log_nested_statements = on

# Logging — write to a file the collector's log-tail sidecar can read
logging_collector = on
log_directory = 'pglog'
log_filename = 'postgresql.log'
log_destination = 'stderr'
log_line_prefix = ''
